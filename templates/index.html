<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма поста</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css')}}">
</head>
<body>
    <div>
        <h3>Форма с POST и многострочное поле.</h3>
        <form action="/add" method="post">
            <input type="text" name="title" placeholder="Заголовок">
            <textarea name="text" placeholder="Текст поста"></textarea>
            <button type="submit">Опубликовать</button>
        </form>

        <a href="">Список постов</a>
        <a href="{{ url_for('registration') }}">Регистрация</a>
    </div>

    <div>
        {% if result %}
                {% for post in result %}
                    <p>Заголовок пост: {{post["title"]}}</p>
                    <p>Текст поста: {{post["text"]}}</p>
                    <form action="/delete/{{ post['id'] }}" method="post">
                        <button type="submit">Удалить</button>
                    </form>
                {% endfor %}
            {% else %}
                <p>Постов нет.</p>
            {% endif %}
    </div>
</body>
</html>
