<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Посты</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>
<body>
    {% if result %}
        {% for post in result %}
            <p>Заголовок пост: {{post["title"]}}</p>
            <p>Текст поста: {{post["text"]}}</p>
        {% endfor %}
    {% else %}
        <p>Постов нет.</p>
    {% endif %}

</body>
</html>
